  <style>
    @keyframes data-flow { to { stroke-dashoffset: -30; } }
    @keyframes signal-pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    @keyframes client-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    .network-flow { stroke-dasharray: 6 9; animation: data-flow 1.6s linear infinite; }
    .network-pulse, .wifi-flow { animation: signal-pulse 2s ease-in-out infinite; }
    .client-float { animation: client-float 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @media (prefers-reduced-motion: reduce) {
      .network-flow, .network-pulse, .wifi-flow, .client-float { animation: none !important; }
    }
  </style>

